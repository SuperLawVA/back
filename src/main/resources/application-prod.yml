spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        connection.provider_disables_autocommit: true
        jdbc.time_zone: UTC
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      continue-on-error: true
      mode: never
  # 애플리케이션 시작 시 데이터베이스 연결 검증 비활성화
  jmx:
    enabled: false

  # 🟢 운영 환경 MongoDB 설정
  data:
    mongodb:
      uri: ${MONGODB_URI}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
        ssl:
          enabled: ${REDIS_SSL_ENABLED:false}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "http://43.203.127.128:8080/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# 🟢 운영 환경 Google Cloud 설정
gcp:
  enabled: ${GCP_ENABLED:true}
  project-id: ${GCP_PROJECT_ID}
  location: ${GCP_LOCATION:us}
  processor-id: ${GCP_PROCESSOR_ID}
  credentials:
    path: ${GCP_CREDENTIALS_PATH:classpath:service-account-key.json}

# 🟢 운영 환경 Gemini API 설정
gemini:
  api-key: ${GEMINI_API_KEY}
  model-name: ${GEMINI_MODEL_NAME:gemini-2.0-flash-exp}
  api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:86400000}

# AES 양방향 암호화 설정
aes:
  secret-key: ${AES_SECRET_KEY}

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    com.superlawva: INFO
    com.superlawva.domain.ocr3: INFO
    com.superlawva.domain.document: INFO
    com.superlawva.domain.words: INFO
    com.superlawva.domain.ml: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.springframework.data.redis: WARN

# 테스트 사용자 생성 비활성화 (프로덕션 환경)
app:
  create-test-users: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never # 또는 always
