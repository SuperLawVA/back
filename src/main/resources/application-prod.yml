spring:
  datasource:
    url: secret
    username: secret
    password: secret
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: UTC
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      continue-on-error: true
      mode: never
  # 애플리케이션 시작 시 데이터베이스 연결 검증 비활성화
  jmx:
    enabled: false
  data:
    mongodb:
      uri: secret
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: secret
  access-token-validity: 86400000

# AES 양방향 암호화 설정
aes:
  secret-key: secret

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    com.superlawva: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

# 테스트 사용자 생성 비활성화 (프로덕션 환경)
app:
  create-test-users: false