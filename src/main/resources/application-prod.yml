jwt:
  secret: secret
  access-token-validity: 86400000

# AES 양방향 암호화 설정
aes:
  secret-key: temporary_aes_key_32_chars_long

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    com.superlawva: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

# 테스트 사용자 생성 비활성화 (프로덕션 환경)
app:
  create-test-users: false
