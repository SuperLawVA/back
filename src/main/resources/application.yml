# 🟢 공통 설정 (모든 프로필에 적용)
spring:
  profiles:
    active: prod # 기본값을 prod로 설정

  # Bean 오버라이딩 비활성화 (중복 Bean 해결됨)
  main:
    allow-bean-definition-overriding: false

  # 🚀 기본 데이터베이스 설정 (prod 프로필과 동일하게 설정)
#  datasource:
  url: secret
  username: secret
  password: secret
  driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 공통 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # 🚀 MongoDB Atlas 설정
  data:
    mongodb:
      uri: ${MONGODB_URI:secret}

    # Redis 설정
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # 🟢 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      enabled: true

  # 🟢 이메일 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: secret
    password: secret
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          debug: true
        debug: true

# 🟢 앱 설정
app:
  email:
    enabled: true
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

# 🔵 카카오 로그인 설정 (추가 설정)
kakao:
  client-id: secret
  client-secret: secret
  redirect-uri: secret

# 🔵 네이버 로그인 설정 (추가 설정)
naver:
  client-id: secret
  client-secret: secret
  redirect-uri: http://localhost:5173/oauth/naver/callback

# 🔵 JWT 설정
jwt:
  secret: ${JWT_SECRET:secret}
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# AES 양방향 암호화 설정 (개인정보 암호화용)
aes:
  secret-key: ${AES_SECRET_KEY:secret}

# 🟢 Google Cloud Document AI 설정
gcp:
  enabled: true
  project-id: secret
  location: us
  processor-id: secret
  credentials:
    path: classpath:service-account-key.json

# 🚀 Gemini API 설정
gemini:
  api-key: secret
  model-name: gemini-2.0-flash-exp
  api-url: https://generativelanguage.googleapis.com

# 계약 API 설정
contract:
  api:
    base-url: ${CONTRACT_API_BASE_URL:}

# ML API 설정
ml:
  api:
    base-url: ${ML_API_BASE_URL:secret}
    connection-timeout: 10000
    read-timeout: 60000

# Swagger 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.superlawva

# 기본 서버 설정
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  max-http-header-size: 64KB
  tomcat:
    max-swallow-size: 100MB
    max-http-post-size: 100MB

# Actuator 설정 (헬스체크용)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# 기본 로깅 설정
logging:
  level:
    com.superlawva: DEBUG
    com.superlawva.domain.ocr: DEBUG
    com.superlawva.domain.ocr3: DEBUG
    org.springframework.security: INFO
    org.springframework.mail: INFO
    org.springframework.data.redis: INFO
    org.hibernate.SQL: INFO
    com.sun.mail: INFO

  # 🚨 임시: Security 비활성화 (디버깅용)
  security:
    enabled: false
    ignored: /**
  autoconfigure:
    exclude: secret

  web:
    resources:
      static-locations: classpath:/static/
