spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # 🟢 파일 업로드 설정 (새로 추가)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy}
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy}
            client-secret: ${NAVER_CLIENT_SECRET:dummy}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# API 서버 설정 (간소화)
api:
  servers:
    # 챗봇 전용 서버 (43.201.42.119:8000)
    chatbot:
      base-url: http://43.201.42.119:8000
      timeout: ${CHATBOT_API_TIMEOUT:30000}

    # 검색 전용 서버 (43.201.42.119:8000)
    search:
      base-url: http://43.201.42.119:8000
      connection-timeout: 10000
      read-timeout: 60000

    # 통합 AI 법률 서비스 서버 (3.34.41.104:8000)
    legal:
      base-url: http://3.34.41.104:8000
      connection-timeout: 10000
      read-timeout: 60000

# 기존 설정 호환성 유지
chatbot:
  api:
    base-url: http://43.201.42.119:8000
    timeout: ${CHATBOT_API_TIMEOUT:30000}

ml:
  api:
    base-url: http://43.201.42.119:8000
    connection-timeout: 10000
    read-timeout: 60000

legal:
  api:
    base-url: http://3.34.41.104:8000
    connection-timeout: 10000
    read-timeout: 60000

# JWT 토큰 설정
jwt:
  secret: ${JWT_SECRET:temporary_jwt_secret_key_for_deployment_min_32_chars}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:86400000}

# AES 양방향 암호화 설정
aes:
  secret-key: ${AES_SECRET_KEY:temporary_aes_key_32_chars_long}

# ARIA 양방향 암호화 설정
aria:
  secret-key: ${ARIA_SECRET_KEY:temporary_aria_key_32_chars}

# 로깅 설정
logging:
  level:
    com.superlawva: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 설정
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  packages-to-scan: com.superlawva

# OAuth2 소셜 로그인 기능 활성화 여부 (기본: 비활성화)
oauth2:
  enabled: false

# 서버 기본 설정
server:
  address: 0.0.0.0
  port: 8080

# AWS S3 설정
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:superlawva-logs}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:ap-northeast-2}

# Gemini API 설정
gemini:
  api-key: ${GEMINI_API_KEY:}
  model-name: ${GEMINI_MODEL_NAME:gemini-1.5-flash}
  api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com}

