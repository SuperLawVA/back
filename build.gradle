plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.superlawva'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// 🟢 Google Cloud BOM으로 버전 관리 (gRPC 버전 충돌 해결)
dependencyManagement {
    imports {
        // mavenBom 'com.google.cloud:libraries-bom:26.28.0'  // 로컬 개발 시 주석처리
        // mavenBom 'io.grpc:grpc-bom:1.60.0' // gRPC 버전 통일  // 로컬 개발 시 주석처리
    }
}

dependencies {
    /* ── Spring Core ───────────────────────────── */
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.security:spring-security-config'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    /* ── OpenAPI Docs ──────────────────────────── */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    /* ── JWT ───────────────────────────────────── */
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    /* ── Database ──────────────────────────────── */
    runtimeOnly 'com.mysql:mysql-connector-j'

    /* ── AWS S3 ────────────────────────────────── */
    implementation 'software.amazon.awssdk:s3:2.24.12'
    implementation 'software.amazon.awssdk:sts:2.24.12'

    /* ── Utils ─────────────────────────────────── */
    implementation 'io.lettuce:lettuce-core'
    implementation 'commons-io:commons-io:2.15.0'

    /* ── Lombok ────────────────────────────────── */
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    /* ── .env 환경변수 ─────────────────────────── */
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    /* ── Test ──────────────────────────────────── */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ✅ JAR 빌드 설정
jar {
    enabled = false
    archiveClassifier = ''
}

bootJar {
    enabled = true
    archiveClassifier = ''
}
