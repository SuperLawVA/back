version: "3.8"

services:
  # Redis만 컨테이너로 사용 (RDS MySQL 사용으로 db 제거)
  redis:
    image: redis:7-alpine
    container_name: superlawva-redis
    restart: unless-stopped
    ports:
      - "6380:6379" # 호스트 6380, 컨테이너 내부 6379
    networks: [app-network]
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis_data:/data

  app:
    image: ${ECR_REGISTRY}/superlawva-backend:${IMAGE_TAG:-latest}
    container_name: superlawva-app
    restart: unless-stopped
    depends_on: [redis]
    env_file: .env
    ports:
      - "8080:8080"
      - "8443:8443"
    networks: [app-network]
    volumes:
      # 호스트의 키스토어 파일(${KEYSTORE_HOST_PATH})을 컨테이너의 고정된 경로로 마운트
      # KEYSTORE_HOST_PATH는 배포 스크립트의 .env 파일에서 설정됩니다.
      - ${SERVER_SSL_KEY_STORE}:/app/keystore.jks:ro
    environment:
      - SERVER_SSL_KEY_STORE=file:/app/keystore.jks # 컨테이너 내부 경로를 사용하도록 오버라이드
      - REDIS_HOST=redis
      - REDIS_PORT=6379 # 내부 네트워크에서는 6379 사용
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_SUPERLAWVA=INFO
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK=WARN
      - LOGGING_LEVEL_ORG_HIBERNATE=WARN
      - LOGGING_LEVEL_ORG_SQL=WARN
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -kf https://localhost:8443/api/health || curl -f http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
