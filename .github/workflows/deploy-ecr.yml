name: Deploy Spring Boot to EC2

on:
  push:
    branches: [back/production]

# 브랜치/태그 이름으로 동시성 그룹을 설정 (슬래시 문제 방지)
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      # 3. Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Spring Boot 애플리케이션 빌드
      - name: Build Spring Boot App
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      # 5. AWS 인증 (env.AWS_REGION 참조로 변경)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker 이미지 빌드, 태깅, 푸시
      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "✅ Docker image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # 7. docker-compose.prod.yml 파일 EC2에 복사
      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/"

      # 8-1. GCP 서비스 계정 키 처리 및 환경변수 주입
      - name: ⬇️ Export GCP key (no base64)
        run: |
          echo '${{ secrets.GCP_SERVICE_KEY_JSON }}' > /tmp/gcp-key.json
          echo "::add-mask::${{ secrets.GCP_SERVICE_KEY_JSON }}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV
          GCP_PROJECT_ID=$(jq -r '.project_id' /tmp/gcp-key.json)
          echo "GCP_PROJECT_ID=$GCP_PROJECT_ID" >> $GITHUB_ENV
          echo "GCP_PROCESSOR_ID=${{ secrets.GCP_PROCESSOR_ID }}" >> $GITHUB_ENV
        shell: bash

      # 8. EC2에 배포 (SSH 액션의 env 기능을 사용하여 변수 주입)
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GCP_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_JSON }} # TODO: 확인 후 삭제
          GCP_SERVICE_KEY_JSON: ${{ secrets.GCP_SERVICE_KEY_JSON }}
          GCP_ENABLED: ${{ secrets.GCP_ENABLED }}
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          GCP_PROCESSOR_ID: ${{ secrets.GCP_PROCESSOR_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          JWT_ACCESS_TOKEN_VALIDITY: ${{ secrets.JWT_ACCESS_TOKEN_VALIDITY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          envs: DATABASE_URL,DB_USERNAME,DB_PASSWORD,MONGODB_URI,JWT_SECRET,AES_SECRET_KEY,MAIL_USERNAME,MAIL_PASSWORD,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,NAVER_REDIRECT_URI,GEMINI_API_KEY,GCP_SERVICE_KEY_JSON,GCP_ENABLED,GCP_PROJECT_ID,GCP_PROCESSOR_ID,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,AWS_S3_BUCKET_NAME,FRONTEND_URL,JWT_ACCESS_TOKEN_VALIDITY,SERVER_PORT,AWS_ACCOUNT_ID
          script: |
            set -e
            set -o pipefail

            export ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            export AWS_REGION="${{ env.AWS_REGION }}"

            echo "======> Deployment started on EC2"
            cd /home/ubuntu

            echo "======> 1. Preparing environment"
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "======> 2a. Creating gcp-key.json file"
            echo "$GCP_SERVICE_KEY_JSON" > /home/ubuntu/gcp-key.json
            echo "✅ gcp-key.json file created."

            echo "======> 2b. Creating .env file"
            cat > .env << EOF
            # --- Database ---
            DATABASE_URL=$DATABASE_URL
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            # --- MongoDB ---
            MONGODB_URI=$MONGODB_URI
            # --- Redis ---
            REDIS_HOST=redis
            REDIS_PORT=6379
            # --- JWT ---
            JWT_SECRET=$JWT_SECRET
            JWT_ACCESS_TOKEN_VALIDITY=$JWT_ACCESS_TOKEN_VALIDITY
            # --- AES ---
            AES_SECRET_KEY=$AES_SECRET_KEY
            # --- Mail ---
            MAIL_USERNAME=$MAIL_USERNAME
            MAIL_PASSWORD=$MAIL_PASSWORD
            # --- Server ---
            SERVER_PORT=$SERVER_PORT
            # --- OAuth2 ---
            KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID
            KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET
            KAKAO_REDIRECT_URI=$KAKAO_REDIRECT_URI
            NAVER_CLIENT_ID=$NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET
            NAVER_REDIRECT_URI=$NAVER_REDIRECT_URI
            # --- AI / ML / Chatbot ---
            GEMINI_API_KEY=$GEMINI_API_KEY
            CHATBOT_API_BASE_URL=http://43.201.42.119:8000
            # --- GCP ---
            GOOGLE_APPLICATION_CREDENTIALS=/home/ubuntu/gcp-key.json
            GCP_ENABLED=true
            GCP_PROJECT_ID=$GCP_PROJECT_ID
            GCP_PROCESSOR_ID=$GCP_PROCESSOR_ID
            # --- AWS S3 ---
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            AWS_REGION=$AWS_REGION
            AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME
            AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID
            # --- General ---
            FRONTEND_URL=$FRONTEND_URL
            SPRING_PROFILES_ACTIVE=prod
            # --- Docker Image Info (from workflow env) ---
            ECR_REGISTRY=$ECR_REGISTRY
            IMAGE_TAG=$IMAGE_TAG
            EOF
            echo "✅ .env file created."

            # echo "======> DIAGNOSTICS: Printing .env file contents"
            # cat .env
            echo "======> DIAGNOSTICS: Value of CHATBOT_API_BASE_URL in shell is: $CHATBOT_API_BASE_URL"

            echo "======> 3. Cleaning up old resources"
            mv docker-compose.prod.yml docker-compose.yml
            if command -v docker-compose &>/dev/null; then COMPOSE_CMD="docker-compose"; else COMPOSE_CMD="docker compose"; fi
            echo "Using '$COMPOSE_CMD' for Docker Compose."

            $COMPOSE_CMD down --remove-orphans || true
            echo "🧹 Clearing up docker resources..."
            docker system prune -af

            echo "======> 4. Starting new containers with --env-file"
            $COMPOSE_CMD --env-file ./.env up -d --force-recreate
            echo "✅ Docker Compose 'up' command executed."

            echo "======> Waiting for containers to initialize..."
            sleep 20

            echo "======> 5. Health check"
            SERVER_PORT=${SERVER_PORT:-8080}
            HEALTH_CHECK_URL="http://localhost:${SERVER_PORT}/actuator/health"
            echo "Health checking at: $HEALTH_CHECK_URL"
            # 10초 간격으로 6번 (총 1분) 헬스체크
            for i in {1..6}; do
              HTTP_CODE=$(curl -s -o /dev/stderr -w "%{http_code}" $HEALTH_CHECK_URL || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "✅ Health check PASSED on attempt $i with status $HTTP_CODE."
                $COMPOSE_CMD ps
                exit 0
              fi
              echo "Attempt $i: Health check failed with HTTP status $HTTP_CODE. Retrying in 10 seconds..."
              sleep 10
            done

            echo "🚨 Health check FAILED after multiple attempts."
            echo "======> Final container status:"
            $COMPOSE_CMD ps -a

            APP_CONTAINER_ID=$($COMPOSE_CMD ps -q app)
            if [ -n "$APP_CONTAINER_ID" ]; then
              echo "======> Displaying last 200 lines of logs for container 'app' ($APP_CONTAINER_ID):"
              docker logs --tail 200 "$APP_CONTAINER_ID"
            else
              echo "⚠️ Could not find the 'app' container to display logs."
            fi

            exit 1
