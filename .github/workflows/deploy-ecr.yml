name: Deploy Spring Boot to EC2

on:
  push:
    branches: [back/production, develop]

# 동일한 브랜치에서 새 워크플로우가 시작되면 이전 워크플로우 취소
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      # 3. Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Spring Boot 애플리케이션 빌드
      - name: Build Spring Boot App
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      # 5. AWS 자격증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. ECR 로그인
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # 7. Docker 이미지 빌드 및 ECR 푸시
      - name: Build & Push Docker image to ECR
        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          echo "Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "✅ Image pushed successfully"
          echo "Image URI: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # 8. docker-compose.prod.yml 파일 EC2에 복사
      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: docker-compose.prod.yml
          target: /home/ubuntu/

      # 9. EC2에 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            set -e

            echo "=== 환경 준비 ==="
            cd /home/ubuntu

            # ECR 로그인
            echo "ECR 로그인..."
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            # 환경변수 파일 생성
            echo "환경변수 설정..."

            # 🚨 GCP 서비스 계정 키 파일 생성
            # GitHub Secret에 저장된 JSON 내용을 파일로 만듭니다.
            echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY_JSON }}" > /home/ubuntu/service-account-key.json

            cat > .env << EOF
            # === 데이터베이스 (RDS) ===
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            # === MongoDB ===
            MONGODB_URI=${{ secrets.MONGODB_URI }}

            # === Redis (Docker Container) ===
            REDIS_HOST=redis
            REDIS_PORT=6379

            # === JWT 토큰 ===
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_TOKEN_VALIDITY=43200000

            # === AES 암호화 ===
            AES_SECRET_KEY=${{ secrets.AES_SECRET_KEY }}

            # === 이메일 서비스 ===
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}

            # === OAuth2 소셜 로그인 ===
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
            NAVER_REDIRECT_URI=${{ secrets.NAVER_REDIRECT_URI }}

            # === AI 서비스 설정 ===
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'dummy-api-key' }}
            GEMINI_MODEL_NAME=gemini-2.0-flash-exp
            GEMINI_API_URL=https://generativelanguage.googleapis.com

            # === Google Cloud 설정 ===
            GCP_ENABLED=${{ secrets.GCP_ENABLED || 'false' }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID || 'dummy-project' }}
            GCP_LOCATION=us
            GCP_PROCESSOR_ID=${{ secrets.GCP_PROCESSOR_ID || 'dummy-processor' }}

            # === ML API 설정 ===
            ML_API_BASE_URL=http://3.34.41.104:8000
            ML_API_CONNECTION_TIMEOUT=10000
            ML_API_READ_TIMEOUT=60000

            # === 기타 설정 ===
            FRONTEND_URL=https://super-lawva.vercel.app
            SERVER_PORT=8080
            SPRING_PROFILES_ACTIVE=prod

            # === Docker 이미지 정보 ===
            ECR_REGISTRY=$ECR_REGISTRY
            IMAGE_TAG=$IMAGE_TAG
            EOF

            # .env 파일 확인 (비밀번호는 마스킹)
            echo "=== .env 파일 생성 완료 ==="
            sed -e 's/PASSWORD=.*/PASSWORD=****/' -e 's/SECRET=.*/SECRET=****/' .env

            echo "=== Docker Compose 배포 ==="
            # 6379/6380 포트 사용 중인 프로세스 강제 종료
            echo "포트 6379/6380 정리 중..."
            sudo fuser -k 6379/tcp || true
            sudo fuser -k 6380/tcp || true
            sudo lsof -ti:6379 | xargs -r sudo kill -9 || true
            sudo lsof -ti:6380 | xargs -r sudo kill -9 || true

            # Redis 시스템 서비스 중지 (있다면)
            sudo systemctl stop redis-server 2>/dev/null || true
            sudo systemctl stop redis 2>/dev/null || true

            # Redis 관련 Docker 컨테이너 정리
            docker stop $(docker ps -q --filter "name=redis") 2>/dev/null || true
            docker rm $(docker ps -aq --filter "name=redis") 2>/dev/null || true

            # Docker Compose 설치 확인 및 명령어 결정
            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            elif docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              echo "Docker Compose를 설치합니다..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              COMPOSE_CMD="docker-compose"
            fi

            echo "사용할 Docker Compose 명령어: $COMPOSE_CMD"

            # 기존 컨테이너 중지
            $COMPOSE_CMD -f docker-compose.prod.yml down || true

            # 새 이미지 풀
            $COMPOSE_CMD -f docker-compose.prod.yml pull app

            # 새 컨테이너 시작
            $COMPOSE_CMD -f docker-compose.prod.yml up -d

            # 로그 확인
            echo "=== 배포 완료 - 실시간 로그 확인 ==="
            echo "60초간 실시간 로그 모니터링..."
            timeout 60s $COMPOSE_CMD -f docker-compose.prod.yml logs -f app || true

            echo "=== 최근 로그 확인 ==="
            $COMPOSE_CMD -f docker-compose.prod.yml logs --tail=100 app

            # 헬스체크
            echo "=== 헬스체크 ==="
            echo "컨테이너 상태 확인:"
            $COMPOSE_CMD -f docker-compose.prod.yml ps

            echo "더 많은 로그 확인:"
            $COMPOSE_CMD -f docker-compose.prod.yml logs --tail=100 app

            # 헬스체크 - 여러 엔드포인트 시도
            for i in {1..3}; do
              echo "헬스체크 시도 $i/3..."
              
              # 1. 커스텀 헬스체크 API 시도
              if curl -f -m 30 http://localhost:8080/api/health; then
                echo "✅ 커스텀 헬스체크 성공!"
                break
              fi
              
              # 2. 간단한 헬스체크 시도
              if curl -f -m 30 http://localhost:8080/health; then
                echo "✅ 간단한 헬스체크 성공!"
                break
              fi
              
              # 3. 상태 API 시도
              if curl -f -m 30 http://localhost:8080/api/v1/status; then
                echo "✅ 상태 API 헬스체크 성공!"
                break
              fi
              
              echo "⏳ 애플리케이션 시작 대기 중... ($i/3)"
              if [ $i -eq 1 ]; then
                echo "=== 중간 로그 확인 ($i) ==="
                $COMPOSE_CMD -f docker-compose.prod.yml logs --tail=50 app
              fi
              sleep 30
            done

            # 정리
            echo "=== 이미지 정리 ==="
            docker system prune -f || true

            echo "🎉 배포 완료!"
