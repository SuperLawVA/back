name: Deploy Spring Boot to EC2

on:
  push:
    branches: [back/production]

# 동일한 브랜치에서 새 워크플로우가 시작되면 이전 워크플로우 취소
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      # 3. Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Spring Boot 애플리케이션 빌드
      - name: Build Spring Boot App
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      # 5. AWS 인증 및 ECR 로그인
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker 이미지 빌드, 태깅, 푸시
      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "✅ Docker image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # 7. docker-compose.prod.yml 파일 EC2에 복사
      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/"

      # 8. EC2에 배포
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          envs: ${{ toJSON(secrets) }} # 모든 시크릿을 안전하게 전달
          script: |
            set -e # 스크립트 실패 시 즉시 중단
            set -o pipefail # 파이프라인 실패 시 중단

            export ECR_REGISTRY=${{ env.ECR_REGISTRY }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export AWS_REGION=${{ env.AWS_REGION }}

            echo "======> Deployment started on EC2"
            cd /home/ubuntu

            echo "======> 1. Preparing environment"
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "======> 2. Creating .env file"
            # GCP 서비스 계정 키 파일 생성
            if [ -n "$GCP_SERVICE_ACCOUNT_KEY_JSON" ]; then
              echo "$GCP_SERVICE_ACCOUNT_KEY_JSON" > /home/ubuntu/service-account-key.json
              echo "✅ GCP service account key created."
            else
              echo "⚠️ GCP service account key not found."
            fi

            # SSL 키스토어 파일 복원
            if [ -n "$SSL_KEYSTORE_BASE64" ]; then
              echo "$SSL_KEYSTORE_BASE64" | base64 -d > /home/ubuntu/keystore.p12
              chmod 600 /home/ubuntu/keystore.p12
              echo "✅ SSL keystore restored."
            else
              echo "⚠️ SSL keystore not found. Running in HTTP mode."
            fi

            # .env 파일 생성
            cat > .env << EOF
            # --- Database ---
            DATABASE_URL=$DATABASE_URL
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            # --- MongoDB ---
            MONGODB_URI=$MONGODB_URI
            # --- Redis ---
            REDIS_HOST=redis
            REDIS_PORT=6379
            # --- JWT ---
            JWT_SECRET=$JWT_SECRET
            JWT_ACCESS_TOKEN_VALIDITY=43200000
            # --- AES ---
            AES_SECRET_KEY=$AES_SECRET_KEY
            # --- Mail ---
            MAIL_USERNAME=$MAIL_USERNAME
            MAIL_PASSWORD=$MAIL_PASSWORD
            # --- SSL/HTTPS ---
            SERVER_PORT=${SERVER_PORT:-8080}
            SERVER_SSL_ENABLED=${SERVER_SSL_ENABLED:-false}
            SERVER_SSL_KEY_STORE=$SERVER_SSL_KEY_STORE
            SERVER_SSL_KEY_STORE_PASSWORD=$SERVER_SSL_KEY_STORE_PASSWORD
            SERVER_SSL_KEY_ALIAS=$SERVER_SSL_KEY_ALIAS
            # --- OAuth2 ---
            KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID
            KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET
            KAKAO_REDIRECT_URI=$KAKAO_REDIRECT_URI
            NAVER_CLIENT_ID=$NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET
            NAVER_REDIRECT_URI=$NAVER_REDIRECT_URI
            # --- AI Services ---
            GEMINI_API_KEY=$GEMINI_API_KEY
            GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-pro}
            GEMINI_API_URL=${GEMINI_API_URL:-https://generativelanguage.googleapis.com}
            # --- GCP ---
            GCP_ENABLED=${GCP_ENABLED:-false}
            GCP_PROJECT_ID=$GCP_PROJECT_ID
            GCP_LOCATION=${GCP_LOCATION:-us}
            GCP_PROCESSOR_ID=$GCP_PROCESSOR_ID
            # --- ML API ---
            ML_API_BASE_URL=$ML_API_BASE_URL
            ML_API_CONNECTION_TIMEOUT=${ML_API_CONNECTION_TIMEOUT:-10000}
            ML_API_READ_TIMEOUT=${ML_API_READ_TIMEOUT:-60000}
            # --- Chatbot API ---
            CHATBOT_API_BASE_URL=$CHATBOT_API_BASE_URL
            CHATBOT_API_TIMEOUT=${CHATBOT_API_TIMEOUT:-30000}
            # --- AWS ---
            AWS_REGION=$AWS_REGION
            AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
            AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME
            # --- General ---
            FRONTEND_URL=$FRONTEND_URL
            SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
            # --- Docker Image Info ---
            ECR_REGISTRY=$ECR_REGISTRY
            IMAGE_TAG=$IMAGE_TAG
            EOF
            echo "✅ .env file created."

            echo "======> 3. Cleaning up old resources"
            # 포트 정리
            PORTS_TO_FREE="6379 6380 8080 8443"
            for PORT in $PORTS_TO_FREE; do
              echo "Clearing port $PORT..."
              sudo fuser -k ${PORT}/tcp || true
              sudo lsof -ti:${PORT} | xargs -r sudo kill -9 || true
            done

            # Docker Compose 명령어 결정
            if command -v docker-compose &>/dev/null; then
              COMPOSE_CMD="docker-compose"
            elif docker compose version &>/dev/null; then
              COMPOSE_CMD="docker compose"
            else
              echo "Error: docker-compose or docker compose not found." >&2
              exit 1
            fi
            echo "Using '$COMPOSE_CMD' for Docker Compose."

            $COMPOSE_CMD -f docker-compose.prod.yml down --remove-orphans || true
            echo "🧹 Clearing up docker resources to free up space..."
            docker system prune -af

            echo "======> 4. Starting new containers"
            $COMPOSE_CMD -f docker-compose.prod.yml pull app
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --force-recreate
            echo "✅ Docker Compose 'up' command executed."

            echo "======> 5. Health check"
            # SSL 활성화 여부에 따라 헬스체크 URL 및 포트 결정
            if [ "$SERVER_SSL_ENABLED" = "true" ]; then
              HEALTH_CHECK_URL="https://localhost:8443/actuator/health"
              CURL_OPTS="--insecure" # 로컬에서 자체 서명 인증서 사용 시 필요
            else
              HEALTH_CHECK_URL="http://localhost:8080/actuator/health"
              CURL_OPTS=""
            fi

            echo "Health checking at: $HEALTH_CHECK_URL"

            # 10초 간격으로 12번 (총 2분) 헬스체크 시도
            for i in {1..12}; do
              # curl의 --fail 옵션은 HTTP 상태 코드가 2xx가 아니면 실패로 처리
              # -s: silent, -f: fail, -v: verbose
              if curl -sf $CURL_OPTS $HEALTH_CHECK_URL; then
                echo "✅ Health check PASSED on attempt $i."
                docker ps
                exit 0
              fi
              echo "Attempt $i: Health check failed. Retrying in 10 seconds..."
              sleep 10
            done

            echo "🚨 Health check FAILED after multiple attempts."
            echo "======> Container logs:"
            $COMPOSE_CMD logs --tail="100" app
            exit 1
