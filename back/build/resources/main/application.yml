# 🟢 공통 설정 (모든 프로필에 적용)
spring:
  profiles:
    active: prod # MongoDB Atlas + RDS MySQL 사용

  # Bean 오버라이딩 비활성화 (중복 Bean 해결됨)
  main:
    allow-bean-definition-overriding: false

  # JPA 공통 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true

  # 🟢 파일 업로드 설정
