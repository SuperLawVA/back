# 테스트 환경 설정
spring:
  # 테스트용 H2 인메모리 데이터베이스
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # 테스트용 Redis (내장 메모리)
  data:
    redis:
      host: localhost
      port: 6370 # 테스트용 포트
      timeout: 1000ms
    mongodb:
      host: localhost
      port: 27017
      database: test_contracts

# 테스트용 GCP 설정 (Mock 데이터)
gcp:
  project-id: test-project
  location: us-test
  processor-id: test-processor-123
  credentials:
    path: classpath:test-credentials.json

# 테스트용 OCR 설정
ocr:
  max-file-size: 10485760 # 10MB (테스트용으로 작게)
  allowed-extensions: pdf,jpg,jpeg,png
  processing-timeout: 30 # 30초 (테스트용으로 짧게)
  confidence-threshold: 0.5

# 🤖 테스트 환경 OpenAI 설정
openai:
  enabled: ${OPENAI_ENABLED:false} # 테스트에서는 기본적으로 비활성화 (환경변수로 활성화 가능)
  api:
    key: ${OPENAI_API_KEY:test-key} # 테스트용 키
    url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  max-tokens: ${OPENAI_MAX_TOKENS:1000}
  temperature: ${OPENAI_TEMPERATURE:0.1}
  timeout: ${OPENAI_TIMEOUT:15000} # 테스트에서는 짧은 타임아웃

# 테스트용 JWT 설정
jwt:
  secret: TEST_JWT_SECRET_1234567890_TEST_JWT_SECRET_1234567890
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# 로깅 설정 (테스트용)
logging:
  level:
    com.springboot: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.springframework.test: DEBUG

# 테스트용 서버 설정
server:
  port: 0 # 랜덤 포트 사용

# 테스트용 이메일 설정
spring.mail:
  host: localhost
  port: 3025
  username: test
  password: test

# 테스트용 Gemini 설정
gemini:
  api-key: test-gemini-key
  model-name: gemini-test
  api-url: https://test.generativelanguage.googleapis.com

# 테스트용 OAuth 설정
kakao:
  client-id: test-kakao-client
  client-secret: test-kakao-secret
  redirect-uri: http://localhost:8080/test

naver:
  client-id: test-naver-client
  client-secret: test-naver-secret
  redirect-uri: http://localhost:8080/test

# 테스트용 앱 설정
app:
  email:
    enabled: false
  frontend:
    url: http://localhost:3000
